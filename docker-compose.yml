services:
  semanticops-rag:
    build: .
    container_name: semanticops-rag
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Keep the downloaded embedding model between restarts.
      HF_HOME: /app/data/hf_cache
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
